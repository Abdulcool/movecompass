<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MoveCompass camera guidance</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        overflow-wrap:normal;
        hyphens:auto;
        margin: 0;
        background: #13231f;
        color: #fff;
        font:
          1rem system-ui,
          sans-serif;
      }
      #tracker {
        max-width: 1100px;
        margin: auto;
        padding: 16px;
      }
      .stage {
        position: relative;
        aspect-ratio: 16/9;
        background: #07120e;
        border-radius: 16px;
        overflow: hidden;
      }
      video,
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      video {
        transform: scaleX(-1);
      }
      canvas {
        cursor: pointer;
      }
      #selection {position:absolute;top:8px;left:8px;right:8px;padding:12px;background:#13231fee;border-radius:12px;z-index:2;}
      #people {display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
      .status {
        display: flex;
        flex-wrap:wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 16px 0;
      }
      #counter {
        font-size: 2.625rem;
        white-space:normal;
        font-weight: 750;
        color: #9fd8be;
      }
      #name {
        font-size: 1.25rem;
        margin: 8px 0;
      }
      progress,button {max-width:100%;}
      progress {width:100%;}
      #feedback {
        font-size: 1.1875rem;
        min-height: 28px;
      }
      #visibility {
        color: #ffc6b4;
        min-height: 24px;
      }
      .bar {
        height: 14px;
        background: #3c5148;
        border-radius: 20px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        background: #9fd8be;
        height: 100%;
        width: 0;
        transition: width 0.1s;
      }
      #range,
      #rom {
        font-size: .875rem;
        color: #c8d8d0;
      }
      button {
        max-width:100%;
        white-space:normal;
        overflow-wrap:normal;
        hyphens:auto;
        background: #9fd8be;
        color: #13231f;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      #error {
        background: #662d25;
        border-radius: 12px;
        padding: 16px;
      }
      p {
        line-height: 1.5;
      }
      @media (max-width: 500px) {
        #tracker {
          padding: 10px;
        }
        .stage {
          aspect-ratio: 3/4;
        }
        #counter {
          font-size: 2.125rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {.bar span{transition:none}}
    </style>
  </head>
  <body>
    <section id="tracker" aria-label="Pose tracking">
      <h2 id="name">Preparing camera guidance…</h2>
      <p id="download">Preparing local tracker · 0%</p>
      <progress id="download-progress" max="100" value="0" aria-label="Local tracker download progress"></progress>
      <div class="stage">
        <div id="selection" role="status" hidden>Tap yourself on the camera image, or choose a person.<div id="people"></div></div>
        <video id="video" autoplay muted playsinline></video
        ><canvas
          id="overlay"
          aria-label="Live pose skeleton and joint angles"
        ></canvas>
      </div>
      <div class="status">
        <strong id="counter" role="status" aria-live="polite" aria-atomic="true">0 / —</strong
        ><span id="phase" role="status" aria-live="polite" aria-atomic="true">Loading local pose model…</span
        ><button id="stop">Stop camera</button>
      </div>
      <p id="feedback" role="status">
        Stand back so your whole body is visible.
      </p>
      <p id="visibility"></p>
      <div
        class="bar"
        role="meter"
        aria-label="Current movement range"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="progress"></span>
      </div>
      <p id="range"></p>
      <p id="rom"></p>
      <p id="error" role="alert" hidden></p>
      <button id="retry" hidden>Try camera again</button>
      <p>
        This feature is guidance, not diagnosis. Stop if you feel pain or
        dizziness. Camera frames stay on this device.
      </p>
    </section>
    <script type="module" src="/tracker/main.js"></script>
  </body>
</html>

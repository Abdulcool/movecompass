<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MoveCompass camera guidance</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #13231f;
        color: #fff;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 16px;
      }
      .stage {
        position: relative;
        aspect-ratio: 16/9;
        background: #07120e;
        border-radius: 16px;
        overflow: hidden;
      }
      video,
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      video {
        transform: scaleX(-1);
      }
      canvas {
        pointer-events: none;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 16px 0;
      }
      #counter {
        font-size: 42px;
        font-weight: 750;
        color: #9fd8be;
      }
      h1 {
        font-size: 20px;
        margin: 8px 0;
      }
      #feedback {
        font-size: 19px;
        min-height: 28px;
      }
      #visibility {
        color: #ffc6b4;
        min-height: 24px;
      }
      .bar {
        height: 14px;
        background: #3c5148;
        border-radius: 20px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        background: #9fd8be;
        height: 100%;
        width: 0;
        transition: width 0.1s;
      }
      #range,
      #rom {
        font-size: 14px;
        color: #c8d8d0;
      }
      button {
        background: #9fd8be;
        color: #13231f;
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      #error {
        background: #662d25;
        border-radius: 12px;
        padding: 16px;
      }
      p {
        line-height: 1.5;
      }
      @media (max-width: 500px) {
        main {
          padding: 10px;
        }
        .stage {
          aspect-ratio: 3/4;
        }
        #counter {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="name">Preparing camera guidance…</h1>
      <p id="download" role="status">Preparing local tracker · 0%</p>
      <progress id="download-progress" max="100" value="0" aria-label="Local tracker download progress"></progress>
      <div class="stage">
        <video id="video" autoplay muted playsinline></video
        ><canvas
          id="overlay"
          aria-label="Live pose skeleton and joint angles"
        ></canvas>
      </div>
      <div class="status">
        <strong id="counter">0 / —</strong
        ><span id="phase">Loading local pose model…</span
        ><button id="stop">Stop camera</button>
      </div>
      <p id="feedback" role="status">
        Stand back so your whole body is visible.
      </p>
      <p id="visibility"></p>
      <div
        class="bar"
        role="meter"
        aria-label="Current movement range"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="progress"></span>
      </div>
      <p id="range"></p>
      <p id="rom"></p>
      <p id="error" role="alert" hidden></p>
      <button id="retry" hidden>Try camera again</button>
      <p>
        This feature is guidance, not diagnosis. Stop if you feel pain or
        dizziness. Camera frames stay on this device.
      </p>
    </main>
    <script type="module" src="/tracker/main.js"></script>
  </body>
</html>
